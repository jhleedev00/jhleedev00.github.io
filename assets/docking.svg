<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550" role="img" aria-labelledby="t d"><title id="t">V-Funnel 기준 형상과 ICP 정합</title><desc id="d">측정 점군을 목표 형상에 맞추고 상대 위치 오차를 제어기로 전달하는 개념도. 실제 측정 데이터가 아닙니다.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#dde6f3" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#245de5" stroke-width="1.4"/></marker></defs><rect width="800" height="550" fill="#f1f5fc"/><rect x="30" y="65" width="740" height="390" fill="url(#grid)"/><g font-family="Arial,sans-serif"><text x="35" y="38" font-size="17" font-weight="bold" fill="#1d3153">2D ICP / REAR LiDAR</text><text x="765" y="38" text-anchor="end" font-size="13" fill="#61738f">CONCEPT DIAGRAM</text><path d="M260 130L390 240V325L260 435" fill="none" stroke="#2c63e7" stroke-width="6" stroke-linecap="round"/><path d="M219 111L351 223V306L220 412" fill="none" stroke="#7b8ea8" stroke-width="9" stroke-dasharray="1 17" stroke-linecap="round"/><path d="M290 172L323 184M346 255L386 255M288 355L330 376" stroke="#8baff5" stroke-width="2" stroke-dasharray="5 5"/><path d="M510 285H412" stroke="#245de5" stroke-width="2" marker-end="url(#arrow)"/><circle cx="556" cy="285" r="55" fill="white" stroke="#142947" stroke-width="2"/><circle cx="556" cy="285" r="7" fill="#245de5"/><path d="M556 285H644M556 285V203" stroke="#52657e" stroke-width="1.5"/><text x="653" y="290" fill="#61738f" font-size="16">x</text><text x="552" y="194" fill="#61738f" font-size="16">y</text><text x="556" y="365" text-anchor="middle" fill="#1d3153" font-size="18">base_link</text><text x="459" y="260" text-anchor="middle" fill="#245de5" font-size="14">Δx, Δy, Δθ</text><path d="M555 285L302 75M555 285L302 480" stroke="#9bb8ed" stroke-width="1.4" stroke-dasharray="6 6"/><line x1="46" x2="